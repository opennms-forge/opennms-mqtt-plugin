---
version: '3'

# using fixed ip addresses so opennms config works
# to see all network use docker network ls
# to see config use docker network inspect minimal-minion-kafka_frontend
# note gateway is 172.20.0.1 
networks:
  frontend:
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  data-postgres: {}
  data-opennms: {}
  data-opennms-cfg: {}
  data-cassandra-01: {}
  data-grafana: {}

services:
  database:
    image: ${DOCKER_REGISTRY:-docker.io}/postgres:${POSTGRES_VERSION:-13}
    container_name: database
    hostname: database
    environment:
      TZ: ${TIMEZONE:-America/New_York}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - data-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 30s
      retries: 3
    networks:
      frontend:
        ipv4_address: 172.20.0.2

  cassandra-01:
    image: ${DOCKER_REGISTRY:-docker.io}/cassandra:${CASSANDRA_VERSION:-3.11}
    container_name: cassandra-01
    hostname: cassandra-01
    environment:
    # https://teckjournal.wordpress.com/2020/05/14/run-cassandra-as-docker-container/ - setting memory size
  # note healthcheck fails if time zone not UTC - need to install pytz see https://murukeshm.github.io/cassandra/trunk/tools/cqlsh.html
  #    TZ: ${TIMEZONE:-America/New_York}
      CASSANDRA_CLUSTER_NAME: opennms-newts
      CASSANDRA_DC: opennms-lab
      CASSANDRA_RACK: opennms-lab-rack
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      LOCAL_JMX: 'false'
      JMX_HOST: 127.0.0.1
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 475M
      JVM_OPTS: "-Xms475M -Xmx1G -XX:InitialHeapSize=475M"

    volumes:
      - data-cassandra-01:/var/lib/cassandra
      # overlay configuration file - note container still overlay edits this on startup with properties defined above
      - ./container-fs/cassandra/etc/cassandra/cassandra.yaml:/etc/cassandra/cassandra.yaml
    networks:
      frontend:
        ipv4_address: 172.20.0.4
    ports:
        - "9042:9042"
    healthcheck:
# #    test: [ "CMD", "/opt/cassandra/bin/cqlsh", "-u cassandra", "-p cassandra" ,"-e \"describe keyspaces\"" ]
# #    test: [ "CMD", "/opt/cassandra/bin/cqlsh", "--username", "cassandra", "--password", "cassandra", "--keyspace", "system" ]
      test: [ "CMD", "/opt/cassandra/bin/cqlsh", "--username", "cassandra", "--password", "cassandra", "--execute", "describe keyspaces" ]
      interval: 30s
      timeout: 10s
      retries: 5
      
  ## see https://stackoverflow.com/questions/40443617/init-script-for-cassandra-with-docker-compose
  ## must run after horizon initialises hte newts keyspace
  cassandra-load-functions:
    container_name: cassandra-load-functions
    image: ${DOCKER_REGISTRY:-docker.io}/cassandra:${CASSANDRA_VERSION:-3.11}
    depends_on: 
      horizon:
        condition: service_healthy
    restart: "no"
    volumes:
       - ./container-fs/cassandra/scripts/newts-functions.cql:/newts-functions.cql
    command: /bin/bash -c "sleep 10 && echo loading cassandra functions && cqlsh --debug --username cassandra --password cassandra cassandra-01 9042 -f /newts-functions.cql"
    networks:
      frontend:
        ipv4_address: 172.20.0.5


  zookeeper:
    image: ${DOCKER_REGISTRY:-docker.io}/confluentinc/cp-zookeeper:${ZOOKEEPER_VERSION:-5.5.0}
    container_name: zookeeper
    hostname: zookeeper
    environment:
      TZ: ${TIMEZONE:-America/New_York}
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      frontend:
        ipv4_address: 172.20.0.6

  broker:
    image: ${DOCKER_REGISTRY:-docker.io}/confluentinc/cp-kafka:${KAFKA_VERSION:-5.5.0}
    container_name: broker
    hostname: broker
    depends_on:
      - zookeeper
    environment:
      TZ: ${TIMEZONE:-America/New_York}
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 5 # The number of partitions > the number of Minions per Location, default is 1
    ports:
      - "29092:29092/tcp"
      - "9092:9092/tcp"
    networks:
      frontend:
        ipv4_address: 172.20.0.8

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    environment:
      TZ: ${TIMEZONE:-America/New_York}
      KAFKA_CLUSTERS_0_NAME: onms-stack-play
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080/tcp"
    networks:
      frontend:
        ipv4_address: 172.20.0.10


  horizon:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_ORG:-opennms}/${HORIZON_OCI:-horizon}:${ONMS_VERSION:-bleeding}
    container_name: horizon
    hostname: horizon
    depends_on: 
      database:
        condition: service_healthy
      cassandra-01:
        condition: service_healthy
    sysctls:
      net.ipv4.ping_group_range: "0 429496729"
    environment:
      TZ: ${TIMEZONE:-America/New_York}
      REPLICATION_FACTOR: 1
      OPENNMS_TIMESERIES_STRATEGY: newts
      OPENNMS_CASSANDRA_DATACENTER: opennms-lab
    volumes:
      - data-opennms:/opennms-data
      - data-opennms-cfg:/opt/opennms/etc
      - ./container-fs/horizon/opt/opennms/deploy:/opt/opennms/deploy
      - ./container-fs/horizon/opt/opennms-overlay:/opt/opennms-overlay
      - ./container-fs/horizon/etc/conf.d/confd.toml:/etc/confd/confd.toml
      - ./container-fs/horizon/misc:/opt/opennms/share/misc
      - ./container-fs/horizon/xmlFiles:/opt/opennms/share/misc/xmlFiles
      - ~/.m2/repository:/usr/share/opennms/share/.m2/repository
    command: ["-s"]
    ports:
      - "8101:8101/tcp"
      - "8980:8980/tcp"
      - "10162:1162/udp"
      - "55555:55555/tcp" # pax exam rmi port
      - "1098:1098/tcp" # java.rmi.activation.port rmi server port - for pax exam
      - "9090:9090/tcp" # ONLY used for camel examples

    healthcheck:
      test: [ "CMD", "curl", "-f", "-I", "http://localhost:8980/opennms/login.jsp" ]
      interval: 1m
      timeout: 5s
      retries: 3
    networks:
      frontend:
        ipv4_address: 172.20.0.12

  grafana:
    image: ${DOCKER_REGISTRY:-docker.io}/grafana/grafana:7.5.1
    container_name: grafana
    hostname: grafana
    environment:
      TZ: ${TIMEZONE:-America/New_York}
      GF_SECURITY_ADMIN_PASSWORD: mypass
      GF_INSTALL_PLUGINS: https://github.com/OpenNMS/opennms-helm/archive/v6.0.0.zip;grafana-piechart-panel;neocat-cal-heatmap-panel
    volumes:
      - data-grafana:/var/lib/grafana
    ports:
      - "3000:3000/tcp"
    networks:
      frontend:
        ipv4_address: 172.20.0.14

  minion1:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_ORG:-opennms}/${MINION_OCI:-minion}:${ONMS_VERSION:-bleeding}
    container_name: minion
    hostname: minion
    sysctls:
      net.ipv4.ping_group_range: "0 429496729"
    environment:
      TZ: ${TIMEZONE:-America/New_York}
      JAVA_MIN_MEM: 512M
      JAVA_MAX_MEM: 2048M
    volumes:
      - ./container-fs/minion1/opt/minion/minion-config.yaml:/opt/minion/minion-config.yaml
    command: ["-f"]
    healthcheck:
      test: "/health.sh"
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "8201:8201/tcp"
      - "1162:1162/udp"
      - "1514:1514/udp"
    networks:
      frontend:
        ipv4_address: 172.20.0.16

#  http://restsimulator:8080/nokia/data
  restsimulator :
    image: jetty:9.4-jre11
    container_name: restsimulator
    hostname: restsimulator
    ports: 
      - "8090:8080"
    volumes:
      - ./container-fs/simulator/deploy/collection-simulator-0.0.1-SNAPSHOT.war:/var/lib/jetty/webapps/root.war
    networks:
      frontend:
        ipv4_address: 172.20.0.20

# first snmp container
  cameranetsnmp1:
    image: polinux/snmpd
    container_name: cameranetsnmp1
    hostname: cameranetsnmp1
    volumes:
      - ./container-fs/snmp/snmpd.conf:/etc/snmp/snmpd.conf
    ports:
      - "11161:161/udp"
    networks:
      frontend:
        ipv4_address: 172.20.0.30

# second snmp container
  cameranetsnmp2:
    image: polinux/snmpd
    container_name: cameranetsnmp2
    hostname: cameranetsnmp2
    volumes:
      - ./container-fs/snmp/snmpd.conf:/etc/snmp/snmpd.conf
    ports:
      - "11162:161/udp"
    networks:
      frontend:
        ipv4_address: 172.20.0.31

